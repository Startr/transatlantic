description = "Drop the always-on transatlantic activation rule into the current repo for every IDE agent"
prompt = "Write the per-repo transatlantic rule files into the current repo and report the result. If `src/tools/caveman-init.js` exists in the current repo (a transatlantic checkout), run `node src/tools/caveman-init.js {{args}}`. Otherwise run the standalone script (self-contained, supports stdin execution): `curl -fsSL https://raw.githubusercontent.com/Startr/transatlantic/master/src/tools/caveman-init.js | node - {{args}}`. Use --dry-run first if the user did not pass --force, so we never silently overwrite an existing rule file."
